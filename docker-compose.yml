version: "3.9"

services:
  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api_gateway
    environment:
      - REACT_APP_API_URL=http://localhost:8080

  # ─── API Gateway (Nginx reverse proxy) ───────────────────────
  api_gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - booking_service
      - notification_service

  # ─── Auth Service ─────────────────────────────────────────────
  auth_service:
    build: ./backend/auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://bookease:secret@db:5432/bookease
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Booking Service ─────────────────────────────────────────
  booking_service:
    build: ./backend/booking_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://bookease:secret@db:5432/bookease
      - JWT_SECRET=${JWT_SECRET:-changeme-in-production}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Notification Service ─────────────────────────────────────
  notification_service:
    build: ./backend/notification_service
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=${SMTP_HOST:-smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - redis

  # ─── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: bookease
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookease
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookease"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # ─── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ─── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana_dashboards:/etc/grafana/provisioning/dashboards

volumes:
  postgres_data:
  redis_data:
  grafana_data:
