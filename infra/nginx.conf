events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth_service:8001;
    }
    upstream booking_service {
        server booking_service:8002;
    }
    upstream notification_service {
        server notification_service:8003;
    }
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;

        # Route /auth/* → auth service
        location /auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Route /bookings/* and /availability → booking service
        location /bookings {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /availability {
            proxy_pass http://booking_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health checks
        location /health/auth {
            proxy_pass http://auth_service/health;
        }
        location /health/booking {
            proxy_pass http://booking_service/health;
        }
        location /health/notification {
            proxy_pass http://notification_service/health;
        }

        # Everything else → frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
